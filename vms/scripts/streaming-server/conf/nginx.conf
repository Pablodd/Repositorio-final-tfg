worker_processes auto;
events {
    worker_connections 1024;
}

rtmp {
    server {
        listen 1935;
        chunk_size 4000;

        application live {
            live on;
            record off;

            # Configuración HLS (Generación de fragmentos)
            hls on;
            hls_path /tmp/hls;
            hls_fragment 4s;
            hls_playlist_length 60s;
            hls_cleanup on;

            # Transcodificación: Cambiado preset a 'veryfast' para estabilidad
            exec ffmpeg -i rtmp://127.0.0.1:1935/live/$name
              -c:v libx264 -preset veryfast -b:v 4000k -f flv /dev/null;
        }
    }
}

http {
    sendfile on;
    tcp_nopush on;
    directio 512;
    default_type application/octet-stream;

    server {
        listen 80;

        # ESTADÍSTICAS: Aquí es donde el Dashboard lee los datos
        location /stat {
            rtmp_stat all;
            
            # CORS Robusto para que Cloud Run no bloquee la lectura
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Origin, X-Requested-With, Content-Type, Accept' always;
            
            # Forzamos que el navegador entienda que es un XML
            add_header Content-Type text/xml;
            add_header Cache-Control no-cache;
            
            # Manejo de Preflight
            if ($request_method = 'OPTIONS') {
                add_header Access-Control-Allow-Origin *;
                return 204;
            }
        }

        # ENTREGA DE VIDEO: Para ver el streaming desde la VM si fuera necesario
        location /hls {
            alias /tmp/hls;
            
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS, HEAD' always;
            add_header 'Cache-Control' 'no-cache';

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*';
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204;
            }
        }

        # Página de bienvenida básica
        location / {
            root html;
            index index.html index.htm;
        }
    }
}
