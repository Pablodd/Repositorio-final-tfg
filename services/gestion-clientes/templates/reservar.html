<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Solicitud de Streaming - TFG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h3 class="mb-0">🚀 Solicitar Nueva Emisión</h3>
                <a href="/dashboard" class="btn btn-sm btn-light">Volver al Panel</a>
            </div>
            <div class="card-body">
                <form action="/reservar" method="post">
                    <div class="mb-3">
                        <label class="form-label">Nombre del Evento</label>
                        <input type="text" name="nombre_evento" class="form-control" required placeholder="Ej: Mi Gran Directo">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email del Cliente (Confirmación)</label>
                        <input type="email" name="cliente_email" class="form-control" required placeholder="tu@email.com">
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Fecha de Inicio</label>
                            <input type="date" name="fecha_inicio" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Hora de Arranque</label>
                            <input type="time" name="hora_arranque" class="form-control" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Crear Evento de Streaming</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
