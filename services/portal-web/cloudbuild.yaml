steps:
  # 1. Construir la imagen de Docker usando la ruta de Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build', 
      '-t', 'europe-southwest1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/frontend-dinamico:$COMMIT_SHA', 
      '-f', 'cloud-run-frontend/portal-web/Dockerfile',
      'cloud-run-frontend/portal-web/'
    ]

  # 2. Empujar la imagen al Artifact Registry correcto
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-southwest1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/frontend-dinamico:$COMMIT_SHA']

  # 3. Desplegar en Cloud Run apuntando a esa imagen
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'portal-web-tfg'
      - '--image'
      - 'europe-southwest1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/frontend-dinamico:$COMMIT_SHA'
      - '--region'
      - 'europe-southwest1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'europe-southwest1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/frontend-dinamico:$COMMIT_SHA'